<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TileyPop</title>

  <!-- Optimized Font Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Lexend:wght@800;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. PRODUCTION ENVIRONMENT VARIABLES
       ========================================================================== */
    :root {
      --ui-sky: #6abef9;
      --ui-charcoal: #0a0a0a;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --safe-area-left: env(safe-area-inset-left, 0px);
      --safe-area-right: env(safe-area-inset-right, 0px);
      --transition-smooth: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: var(--ui-sky);
      font-family: "Fredoka", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden !important;
      color: #ffffff;
    }

    /* ==========================================================================
       2. FLUID UI ENGINE
       ========================================================================== */
    .viewport-container {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-areas: "main";
      overflow: hidden;
      position: relative;
    }

    .stage {
      grid-area: main;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: var(--safe-area-top) 1fr var(--safe-area-bottom);
      padding-left: var(--safe-area-left);
      padding-right: var(--safe-area-right);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
      z-index: 1;
      position: relative;
    }

    .stage.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      z-index: 10;
    }

    /* Adaptive Background Architecture */
    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: -1;
      background-color: var(--ui-charcoal);
      pointer-events: none;
    }

    /* Layout Grid for UI Elements */
    .hud-shell {
      grid-row: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(10px, 2.2vh, 24px) clamp(12px, 3.5vw, 24px) clamp(16px, 6vh, 60px);
    }

    .top-bar {
      width: 100%;
      max-width: min(540px, 96vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(8px, 2vw, 14px);
    }

    .currencies {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2.2vw, 16px);
      min-width: 0;
    }

    .currency-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: clamp(32px, 4.8vh, 48px);
      min-width: clamp(92px, 26vw, 152px);
      padding: 0 clamp(6px, 1.8vw, 12px) 0 clamp(30px, 8vw, 48px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(22, 74, 138, 0.88) 0%, rgba(12, 46, 92, 0.94) 100%);
      border: clamp(2px, 0.5vw, 3px) solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 clamp(3px, 0.7vh, 5px) 0 rgba(8, 30, 62, 0.55),
        inset 0 clamp(1px, 0.4vh, 3px) clamp(2px, 0.8vw, 5px) rgba(255, 255, 255, 0.25);
    }

    .currency-icon {
      position: absolute;
      left: clamp(-5px, -1.2vw, -7px);
      top: 50%;
      transform: translateY(-50%);
      width: clamp(36px, 9.8vw, 56px);
      height: clamp(36px, 9.8vw, 56px);
      object-fit: contain;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 clamp(2px, 0.4vh, 3px) clamp(2px, 0.7vw, 5px) rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    .currency-value {
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(14px, 4vw, 22px);
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow: 0 clamp(1px, 0.3vh, 2.5px) 0 rgba(4, 20, 44, 0.75);
      margin-right: clamp(5px, 1.2vw, 10px);
    }

    .plus-btn {
      position: relative;
      margin-left: auto;
      width: clamp(20px, 5.6vw, 32px);
      height: clamp(20px, 5.6vw, 32px);
      border-radius: 50%;
      border: clamp(1.5px, 0.4vw, 2.5px) solid #ffffff;
      background: linear-gradient(180deg, #74f53d 0%, #38ba0d 58%, #218704 100%);
      box-shadow:
        0 clamp(2px, 0.5vh, 3.5px) 0 #145902,
        inset 0 clamp(1px, 0.3vh, 2px) clamp(1.5px, 0.5vw, 3px) rgba(255, 255, 255, 0.65);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .plus-btn:active {
      transform: scale(0.96);
      filter: brightness(1.06);
    }

    .plus-btn::before,
    .plus-btn::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 1px 0 rgba(16, 76, 2, 0.75);
    }

    .plus-btn::before {
      width: 52%;
      height: 15%;
    }

    .plus-btn::after {
      width: 15%;
      height: 52%;
    }

    .settings-btn {
      width: clamp(34px, 9.5vw, 52px);
      height: clamp(34px, 9.5vw, 52px);
      border-radius: 50%;
      border: clamp(2px, 0.5vw, 3px) solid #ffffff;
      background: linear-gradient(180deg, #5ec0ff 0%, #247be5 60%, #1454ad 100%);
      box-shadow:
        0 clamp(2.5px, 0.6vh, 4.5px) 0 rgba(10, 40, 84, 0.65),
        inset 0 clamp(1px, 0.35vh, 2.5px) clamp(2px, 0.7vw, 5px) rgba(255, 255, 255, 0.5);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .settings-btn:active {
      transform: scale(0.96);
      filter: brightness(1.06);
    }

    .gear-icon {
      width: 60%;
      height: 60%;
      fill: #ffffff;
      filter: drop-shadow(0 1px 0 rgba(10, 39, 82, 0.65));
    }

    .ui-slot {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: clamp(48px, 13vh, 135px);
      padding-left: clamp(12px, 4vw, 24px);
      padding-right: clamp(12px, 4vw, 24px);
      width: 100%;
      max-width: min(500px, 92vw);
      margin: 0 auto;
    }

    .play-now-btn {
      position: relative;
      width: min(90%, 400px);
      height: clamp(50px, 7.6vh, 76px);
      border-radius: 999px;
      border: clamp(2.5px, 0.6vw, 4px) solid #ffffff;
      background: linear-gradient(180deg, #ffd63d 0%, #ffa800 52%, #eb7600 100%);
      box-shadow:
        0 clamp(4px, 1vh, 8px) 0 #a84800,
        0 clamp(6px, 1.4vh, 12px) clamp(10px, 2vw, 20px) rgba(15, 56, 110, 0.35),
        inset 0 clamp(2px, 0.5vh, 4px) clamp(4px, 1vw, 8px) rgba(255, 250, 210, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.5vw, 16px);
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .play-now-btn:active {
      transform: scale(0.96);
      filter: brightness(1.05);
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: clamp(10px, 2.6vw, 17px) 0 clamp(10px, 2.6vw, 17px) clamp(16px, 4.2vw, 27px);
      border-color: transparent transparent transparent #ffffff;
      filter: drop-shadow(0 2px 0 rgba(145, 56, 0, 0.7));
      transform: translateX(2px);
    }

    .play-now-text {
      color: #ffffff;
      font-family: "Lexend", "Fredoka", sans-serif;
      font-weight: 900;
      font-size: clamp(20px, 5.6vw, 34px);
      line-height: 1;
      letter-spacing: 0.01em;
      text-shadow:
        0 clamp(2px, 0.4vh, 3.5px) 0 #b85100,
        0 clamp(3px, 0.6vh, 5px) clamp(4px, 0.8vw, 7px) rgba(92, 34, 0, 0.45);
    }

    /* ==========================================================================
       3. ADAPTIVE RESPONSIVE BREAKPOINTS
       ========================================================================== */

    /* Ultra-Small Devices & Foldables Closed (width <= 360px) */
    @media screen and (max-width: 360px) {
      .ui-slot {
        padding-bottom: max(36px, calc(var(--safe-area-bottom) + 28px));
        max-width: 100%;
      }

      .play-now-btn {
        width: 100%;
      }
    }

    /* Tablets & Foldables Open (600px - 1024px in Portrait) */
    @media screen and (min-width: 600px) and (orientation: portrait) {
      .top-bar {
        max-width: 660px;
      }

      .ui-slot {
        max-width: 520px;
        padding-bottom: clamp(70px, 14vh, 150px);
      }

      .play-now-btn {
        width: 100%;
        max-width: 440px;
      }
    }

    /* Desktop & Ultrawide Displays (min-width: 1025px) */
    @media screen and (min-width: 1025px) {
      .top-bar {
        max-width: 680px;
      }

      .ui-slot {
        max-width: 480px;
        padding-bottom: clamp(60px, 12vh, 130px);
      }

      .play-now-btn {
        width: 100%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="viewport-container" id="app-root">
    <section class="stage is-active" id="screen-home" aria-label="TileyPop Home Screen">
      <img src="./assets/home-background.webp" class="bg-layer" alt="TileyPop Background" />

      <div class="hud-shell">
        <header class="top-bar">
          <div class="currencies">
            <div class="currency-pill" aria-label="Coins: 1250">
              <img class="currency-icon" src="./assets/coin.webp" alt="Coin" />
              <span class="currency-value" id="coin-count">1250</span>
              <button type="button" class="plus-btn" id="add-coins-btn" aria-label="Add Coins"></button>
            </div>

            <div class="currency-pill" aria-label="Diamonds: 18">
              <img class="currency-icon" src="./assets/diamond.webp" alt="Diamond" />
              <span class="currency-value" id="diamond-count">18</span>
              <button type="button" class="plus-btn" id="add-diamonds-btn" aria-label="Add Diamonds"></button>
            </div>
          </div>

          <button type="button" class="settings-btn" id="settings-btn" aria-label="Settings">
            <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
            </svg>
          </button>
        </header>

        <div class="ui-slot">
          <button type="button" class="play-now-btn" id="play-now-btn" aria-label="Play Now">
            <span class="play-triangle" aria-hidden="true"></span>
            <span class="play-now-text">Play Now</span>
          </button>
        </div>
      </div>
    </section>
  </div>

  <script src="./game.js"></script>
</body>
</html>
