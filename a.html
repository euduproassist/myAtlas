<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TileyPop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: manipulation;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #6abef9;
      font-family: "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      color: #ffffff;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 0;
      pointer-events: none;
    }

    .hud-layer {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: calc(var(--safe-top) + clamp(10px, 2.2vh, 24px));
      padding-bottom: calc(var(--safe-bottom) + clamp(18px, 3vh, 36px));
      padding-left: calc(var(--safe-left) + clamp(12px, 3.5vw, 28px));
      padding-right: calc(var(--safe-right) + clamp(12px, 3.5vw, 28px));
    }

    /* Top HUD Row */
    .top-bar {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(8px, 2vw, 16px);
    }

    .currencies {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2.4vw, 18px);
      min-width: 0;
    }

    .currency-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: clamp(34px, 5.2vh, 54px);
      min-width: clamp(98px, 28vw, 165px);
      padding: 0 clamp(8px, 2vw, 14px) 0 clamp(34px, 8.5vw, 56px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(22, 74, 138, 0.88) 0%, rgba(12, 46, 92, 0.94) 100%);
      border: clamp(2px, 0.55vw, 3.5px) solid rgba(255, 255, 255, 0.92);
      box-shadow:
        0 clamp(3px, 0.7vh, 6px) 0 rgba(8, 30, 62, 0.55),
        inset 0 clamp(1.5px, 0.4vh, 3px) clamp(3px, 0.8vw, 6px) rgba(255, 255, 255, 0.25);
    }

    .currency-icon {
      position: absolute;
      left: clamp(-6px, -1.4vw, -8px);
      top: 50%;
      transform: translateY(-50%);
      width: clamp(38px, 10.5vw, 64px);
      height: clamp(38px, 10.5vw, 64px);
      object-fit: contain;
      mix-blend-mode: lighten;
      filter: drop-shadow(0 clamp(2px, 0.5vh, 4px) clamp(3px, 0.8vw, 6px) rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    .currency-value {
      color: #ffffff;
      font-weight: 800;
      font-size: clamp(15px, 4.4vw, 26px);
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow: 0 clamp(1.5px, 0.35vh, 3px) 0 rgba(4, 20, 44, 0.75);
      margin-right: clamp(6px, 1.5vw, 12px);
    }

    .plus-btn {
      position: relative;
      margin-left: auto;
      width: clamp(22px, 6.2vw, 36px);
      height: clamp(22px, 6.2vw, 36px);
      border-radius: 50%;
      border: clamp(1.5px, 0.45vw, 2.5px) solid #ffffff;
      background: linear-gradient(180deg, #74f53d 0%, #38ba0d 58%, #218704 100%);
      box-shadow:
        0 clamp(2px, 0.5vh, 4px) 0 #145902,
        inset 0 clamp(1px, 0.3vh, 2.5px) clamp(2px, 0.5vw, 4px) rgba(255, 255, 255, 0.65);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .plus-btn:active {
      transform: translateY(2px) scale(0.96);
      filter: brightness(1.06);
    }

    .plus-btn::before,
    .plus-btn::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 1px 0 rgba(16, 76, 2, 0.75);
    }

    .plus-btn::before {
      width: 52%;
      height: 15%;
    }

    .plus-btn::after {
      width: 15%;
      height: 52%;
    }

    .settings-btn {
      width: clamp(38px, 10.5vw, 60px);
      height: clamp(38px, 10.5vw, 60px);
      border-radius: 50%;
      border: clamp(2px, 0.55vw, 3.5px) solid #ffffff;
      background: linear-gradient(180deg, #5ec0ff 0%, #247be5 60%, #1454ad 100%);
      box-shadow:
        0 clamp(3px, 0.7vh, 5px) 0 rgba(10, 40, 84, 0.65),
        inset 0 clamp(1.5px, 0.4vh, 3px) clamp(3px, 0.8vw, 6px) rgba(255, 255, 255, 0.5);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .settings-btn:active {
      transform: translateY(2px) scale(0.96);
      filter: brightness(1.06);
    }

    .gear-icon {
      width: 60%;
      height: 60%;
      fill: #ffffff;
      filter: drop-shadow(0 1.5px 0 rgba(10, 39, 82, 0.65));
    }

    /* Bottom CTA Area */
    .bottom-cta-slot {
      width: 100%;
      max-width: min(460px, 88vw);
      margin: 0 auto;
      margin-bottom: clamp(44px, 12vh, 130px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .play-now-btn {
      position: relative;
      width: 100%;
      height: clamp(54px, 8.2vh, 84px);
      border-radius: 999px;
      border: clamp(2.5px, 0.65vw, 4px) solid #ffffff;
      background: linear-gradient(180deg, #ffd63d 0%, #ffa800 52%, #eb7600 100%);
      box-shadow:
        0 clamp(5px, 1.1vh, 9px) 0 #a84800,
        0 clamp(7px, 1.5vh, 14px) clamp(12px, 2.5vw, 24px) rgba(15, 56, 110, 0.35),
        inset 0 clamp(2.5px, 0.6vh, 5px) clamp(5px, 1.2vw, 10px) rgba(255, 250, 210, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.8vw, 18px);
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .play-now-btn:active {
      transform: translateY(3px) scale(0.98);
      filter: brightness(1.05);
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: clamp(11px, 3vw, 19px) 0 clamp(11px, 3vw, 19px) clamp(18px, 4.8vw, 30px);
      border-color: transparent transparent transparent #ffffff;
      filter: drop-shadow(0 2px 0 rgba(145, 56, 0, 0.7));
      transform: translateX(2px);
    }

    .play-now-text {
      color: #ffffff;
      font-weight: 900;
      font-size: clamp(24px, 6.8vw, 42px);
      line-height: 1;
      letter-spacing: 0.01em;
      text-shadow:
        0 clamp(2px, 0.45vh, 4px) 0 #b85100,
        0 clamp(3px, 0.65vh, 6px) clamp(4px, 1vw, 8px) rgba(92, 34, 0, 0.45);
    }

    /* Portrait Tablet & Foldable Tweaks */
    @media screen and (min-width: 600px) and (orientation: portrait) {
      .top-bar {
        max-width: 680px;
      }

      .bottom-cta-slot {
        max-width: 480px;
        margin-bottom: clamp(70px, 14vh, 160px);
      }
    }
  </style>
</head>
<body>
  <main class="viewport-container" id="app-root" aria-label="TileyPop Home Screen">
    <img src="./assets/home-background.webp" class="bg-layer" alt="TileyPop Background" />

    <div class="hud-layer">
      <header class="top-bar">
        <div class="currencies">
          <div class="currency-pill" aria-label="Coins: 1250">
            <img class="currency-icon" src="./assets/coin.webp" alt="Coin" />
            <span class="currency-value" id="coin-count">1250</span>
            <button type="button" class="plus-btn" id="add-coins-btn" aria-label="Add Coins"></button>
          </div>

          <div class="currency-pill" aria-label="Diamonds: 18">
            <img class="currency-icon" src="./assets/diamond.webp" alt="Diamond" />
            <span class="currency-value" id="diamond-count">18</span>
            <button type="button" class="plus-btn" id="add-diamonds-btn" aria-label="Add Diamonds"></button>
          </div>
        </div>

        <button type="button" class="settings-btn" id="settings-btn" aria-label="Settings">
          <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
      </header>

      <div class="bottom-cta-slot">
        <button type="button" class="play-now-btn" id="play-now-btn" aria-label="Play Now">
          <span class="play-triangle" aria-hidden="true"></span>
          <span class="play-now-text">Play Now</span>
        </button>
      </div>
    </div>
  </main>

  <script src="./game.js"></script>
</body>
</html>
