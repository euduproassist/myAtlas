<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TileyPop</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #6abef9;
      font-family: "Fredoka", "Nunito", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    /* Full-bleed portrait stage across phones and tablets */
    .home-scene {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #6abef9;
      background-image: url("./assets/home-background.webp");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      /* 100 * var(--u) always fits cleanly within both width and height */
      --u: min(calc(100vw / 100), calc(100dvh / 177.78));
    }

    /* On wider portrait screens (iPad / Android tablets), keep the UI locked to the background artwork's true 9:16 coordinate box */
    .ui-safe-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: calc(100 * var(--u));
      height: calc(177.78 * var(--u));
      max-width: 100vw;
      max-height: 100dvh;
      pointer-events: none;
    }

    /* Top HUD Row: Coins + Diamonds on left, Settings on right */
    .top-bar {
      position: absolute;
      top: max(calc(3.2 * var(--u)), env(safe-area-inset-top));
      left: calc(4.2 * var(--u));
      right: calc(4.2 * var(--u));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(2.4 * var(--u));
      z-index: 2;
      pointer-events: auto;
    }

    .currencies {
      display: flex;
      align-items: center;
      gap: calc(2.8 * var(--u));
      min-width: 0;
    }

    .currency-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      height: calc(9.2 * var(--u));
      min-width: calc(29.5 * var(--u));
      padding: 0 calc(2.4 * var(--u)) 0 calc(10.2 * var(--u));
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(22, 74, 138, 0.88) 0%, rgba(12, 46, 92, 0.94) 100%);
      border: calc(0.6 * var(--u)) solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 calc(1 * var(--u)) 0 rgba(8, 30, 62, 0.55),
        inset 0 calc(0.45 * var(--u)) calc(0.8 * var(--u)) rgba(255, 255, 255, 0.25);
    }

    .currency-icon {
      position: absolute;
      left: calc(-1.4 * var(--u));
      top: 50%;
      transform: translateY(-50%);
      width: calc(11.4 * var(--u));
      height: calc(11.4 * var(--u));
      object-fit: contain;
      /* Removes solid black background from non-transparent WebP icons */
      mix-blend-mode: lighten;
      filter: drop-shadow(0 calc(0.5 * var(--u)) calc(0.7 * var(--u)) rgba(0, 0, 0, 0.35));
      pointer-events: none;
    }

    .currency-value {
      color: #ffffff;
      font-weight: 800;
      font-size: calc(5.1 * var(--u));
      line-height: 1;
      letter-spacing: 0.02em;
      text-shadow: 0 calc(0.4 * var(--u)) 0 rgba(4, 20, 44, 0.75);
      margin-right: calc(1.8 * var(--u));
    }

    .plus-btn {
      position: relative;
      margin-left: auto;
      width: calc(6.6 * var(--u));
      height: calc(6.6 * var(--u));
      border-radius: 50%;
      border: calc(0.5 * var(--u)) solid #ffffff;
      background: linear-gradient(180deg, #74f53d 0%, #38ba0d 58%, #218704 100%);
      box-shadow:
        0 calc(0.65 * var(--u)) 0 #145902,
        inset 0 calc(0.3 * var(--u)) calc(0.45 * var(--u)) rgba(255, 255, 255, 0.65);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .plus-btn:active {
      transform: translateY(calc(0.4 * var(--u))) scale(0.96);
      filter: brightness(1.06);
    }

    .plus-btn::before,
    .plus-btn::after {
      content: "";
      position: absolute;
      background: #ffffff;
      border-radius: 999px;
      box-shadow: 0 calc(0.2 * var(--u)) 0 rgba(16, 76, 2, 0.75);
    }

    .plus-btn::before {
      width: calc(3.2 * var(--u));
      height: calc(0.9 * var(--u));
    }

    .plus-btn::after {
      width: calc(0.9 * var(--u));
      height: calc(3.2 * var(--u));
    }

    /* Circular Settings Button on Top-Right */
    .settings-btn {
      width: calc(11.6 * var(--u));
      height: calc(11.6 * var(--u));
      border-radius: 50%;
      border: calc(0.65 * var(--u)) solid #ffffff;
      background: linear-gradient(180deg, #5ec0ff 0%, #247be5 60%, #1454ad 100%);
      box-shadow:
        0 calc(0.9 * var(--u)) 0 rgba(10, 40, 84, 0.65),
        inset 0 calc(0.4 * var(--u)) calc(0.75 * var(--u)) rgba(255, 255, 255, 0.5);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .settings-btn:active {
      transform: translateY(calc(0.4 * var(--u))) scale(0.96);
      filter: brightness(1.06);
    }

    .gear-icon {
      width: calc(7 * var(--u));
      height: calc(7 * var(--u));
      fill: #ffffff;
      filter: drop-shadow(0 calc(0.3 * var(--u)) 0 rgba(10, 39, 82, 0.65));
    }

    /* Play Now CTA positioned accurately between the puzzle showcase and bottom tagline */
    .play-cta-wrap {
      position: absolute;
      left: 50%;
      top: 72.2%;
      transform: translateX(-50%);
      width: calc(78 * var(--u));
      z-index: 2;
      pointer-events: auto;
    }

    .play-now-btn {
      position: relative;
      width: 100%;
      height: calc(16.4 * var(--u));
      border-radius: 999px;
      border: calc(0.8 * var(--u)) solid #ffffff;
      background: linear-gradient(180deg, #ffd63d 0%, #ffa800 52%, #eb7600 100%);
      box-shadow:
        0 calc(1.5 * var(--u)) 0 #a84800,
        0 calc(2.2 * var(--u)) calc(3.4 * var(--u)) rgba(15, 56, 110, 0.32),
        inset 0 calc(0.8 * var(--u)) calc(1.3 * var(--u)) rgba(255, 250, 210, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(3.2 * var(--u));
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .play-now-btn:active {
      transform: translateY(calc(0.75 * var(--u))) scale(0.98);
      filter: brightness(1.05);
    }

    .play-triangle {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: calc(3.7 * var(--u)) 0 calc(3.7 * var(--u)) calc(6 * var(--u));
      border-color: transparent transparent transparent #ffffff;
      filter: drop-shadow(0 calc(0.4 * var(--u)) 0 rgba(145, 56, 0, 0.7));
      transform: translateX(calc(0.35 * var(--u)));
    }

    .play-now-text {
      color: #ffffff;
      font-weight: 900;
      font-size: calc(8 * var(--u));
      line-height: 1;
      letter-spacing: 0.01em;
      text-shadow:
        0 calc(0.5 * var(--u)) 0 #b85100,
        0 calc(0.75 * var(--u)) calc(0.55 * var(--u)) rgba(92, 34, 0, 0.45);
    }
  </style>
</head>
<body>
  <main class="home-scene" aria-label="TileyPop Home Screen">
    <div class="ui-safe-frame">
      <header class="top-bar">
        <div class="currencies">
          <div class="currency-pill" aria-label="Coins: 1250">
            <img class="currency-icon" src="./assets/coin.webp" alt="Coin" />
            <span class="currency-value">1250</span>
            <button type="button" class="plus-btn" aria-label="Add Coins"></button>
          </div>

          <div class="currency-pill" aria-label="Diamonds: 18">
            <img class="currency-icon" src="./assets/diamond.webp" alt="Diamond" />
            <span class="currency-value">18</span>
            <button type="button" class="plus-btn" aria-label="Add Diamonds"></button>
          </div>
        </div>

        <button type="button" class="settings-btn" aria-label="Settings">
          <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
      </header>

      <div class="play-cta-wrap">
        <button type="button" class="play-now-btn" aria-label="Play Now">
          <span class="play-triangle" aria-hidden="true"></span>
          <span class="play-now-text">Play Now</span>
        </button>
      </div>
    </div>
  </main>

  <script src="./game.js"></script>
</body>
</html>
