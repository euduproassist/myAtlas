<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TileyPop | Menu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Lexend:wght@800&display=swap" rel="stylesheet">

    <style>
        :root {
            --ui-black: #000000;
            --ui-charcoal: #0a0a0a;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
            --transition-smooth: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: var(--ui-black);
            font-family: 'Fredoka', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden !important;
            color: #ffffff;
        }

        .viewport-container {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-areas: "main";
            overflow: hidden;
            position: relative;
        }

        .stage {
            grid-area: main;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: var(--safe-area-top) 1fr var(--safe-area-bottom);
            padding-left: var(--safe-area-left);
            padding-right: var(--safe-area-right);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity var(--transition-smooth);
            z-index: 1;
            box-sizing: border-box;
        }

        .stage.is-active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 10;
        }

        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: -1;
            background-color: var(--ui-charcoal);
        }

        .ui-slot {
            grid-row: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: clamp(16px, 6vh, 60px);
            padding-left: clamp(12px, 4vw, 24px);
            padding-right: clamp(12px, 4vw, 24px);
            width: 100%;
            max-width: min(500px, 92vw);
            margin: 0 auto;
            box-sizing: border-box;
        }

        .cta-button {
            width: min(90%, 400px);
            max-width: 400px;
            padding: clamp(12px, 2.2vh, 18px) clamp(16px, 4vw, 24px);
            margin: clamp(6px, 1.2vh, 10px) 0;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-family: 'Lexend', sans-serif;
            font-weight: 800;
            font-size: clamp(0.9rem, 2.2vw, 1.1rem);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .cta-button:active {
            transform: scale(0.96);
        }

        .btn-guest {
            background: linear-gradient(180deg, #72c613, #4a9405);
            color: #fff;
            border-bottom: 4px solid #1b4903;
        }

        .btn-google {
            background: #fff;
            color: #3c4043;
            border-bottom: 4px solid #999;
        }

        @media screen and (max-width: 360px) {
            .ui-slot {
                padding-bottom: max(12px, var(--safe-area-bottom));
                max-width: 100%;
            }
            .cta-button {
                width: 100%;
                padding: 12px 14px;
            }
        }

        @media screen and (min-width: 600px) and (orientation: portrait) {
            .ui-slot {
                max-width: 520px;
                padding-bottom: clamp(40px, 10vh, 90px);
            }
            .cta-button {
                width: 100%;
                max-width: 440px;
            }
        }

        @media screen and (min-width: 1025px) {
            .ui-slot {
                max-width: 480px;
                padding-bottom: clamp(40px, 8vh, 80px);
            }
            .cta-button {
                width: 100%;
                max-width: 400px;
            }
        }

        @media screen and (max-height: 500px) and (orientation: landscape) {
            .ui-slot {
                padding-bottom: max(8px, var(--safe-area-bottom));
                max-width: min(550px, 85vw);
            }
            .cta-button {
                padding: 8px 16px;
                margin: 4px 0;
                font-size: clamp(0.8rem, 3.5vh, 0.95rem);
                max-width: 320px;
            }
        }

        @media screen and (min-height: 501px) and (orientation: landscape) {
            .ui-slot {
                padding-bottom: clamp(24px, 6vh, 60px);
                max-width: 480px;
            }
        }
    </style>
</head>
<body>
    <div class="viewport-container" id="app-root">
        <section class="stage is-active" id="screen-menu">
            <img src="https://euduproassist.github.io/TileyPop/assets/home-background.webp" class="bg-layer" alt="Menu Background">
            <div class="ui-slot">
                <button class="cta-button btn-guest" role="button" aria-label="Play as guest" tabindex="0">Play As Guest</button>
                <button class="cta-button btn-google" role="button" aria-label="Sign in with Google" tabindex="0">Sign In With Google</button>
            </div>
        </section>
    </div>
</body>
</html>
