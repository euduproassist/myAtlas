<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#38a9ef">

    <title>TileyPop</title>

    <style>

        /* =====================================
           1. GLOBAL SETTINGS
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #38a9ef;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        /* =====================================
           2. FULL SCREEN APPLICATION
        ===================================== */

        #app {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;
            height: 100dvh;

            overflow: hidden;
        }

        #home-screen {
            position: relative;

            width: 100%;
            height: 100%;
            height: 100dvh;

            overflow: hidden;
            isolation: isolate;
        }

        /* =====================================
           3. FULL SCREEN BACKGROUND
        ===================================== */

        .home-background {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            z-index: -1;
            pointer-events: none;

            -webkit-user-drag: none;
        }

        /* =====================================
           4. RESPONSIVE INTERFACE LAYER
        ===================================== */

        .home-interface {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            padding-top: max(2%, env(safe-area-inset-top));
            padding-left: max(3%, env(safe-area-inset-left));
            padding-right: max(3%, env(safe-area-inset-right));
            padding-bottom: max(2%, env(safe-area-inset-bottom));

            pointer-events: none;
        }

        .home-interface button {
            pointer-events: auto;
        }

        /* =====================================
           5. TOP BAR
        ===================================== */

        .top-bar {
            position: absolute;

            top: max(2.5%, env(safe-area-inset-top));
            left: 3%;
            right: 3%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        /* =====================================
           6. COIN AND DIAMOND CONTAINER
        ===================================== */

        .currency-container {
            display: flex;
            align-items: center;

            gap: clamp(6px, 2vw, 15px);

            min-width: 0;
        }

        .currency-counter {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: clamp(3px, 1vw, 8px);

            width: clamp(100px, 30vw, 145px);
            height: clamp(36px, 5.5vh, 49px);

            padding: 3px 6px;

            background: rgba(28, 119, 195, 0.91);

            border: 2px solid #ffffff;
            border-radius: 40px;

            box-shadow:
                0 3px 7px rgba(0, 60, 120, 0.25),
                inset 0 2px 3px rgba(255, 255, 255, 0.25);
        }

        /* =====================================
           7. CURRENCY IMAGES
        ===================================== */

        .currency-icon {
            width: clamp(25px, 5vh, 38px);
            height: clamp(25px, 5vh, 38px);

            object-fit: contain;

            flex-shrink: 0;
        }

        .currency-amount {
            flex: 1;
            min-width: 0;

            color: #ffffff;

            font-size: clamp(12px, 2.2vh, 18px);
            font-weight: 900;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
        }

        /* =====================================
           8. GREEN PLUS BUTTONS
        ===================================== */

        .currency-add-button {
            width: clamp(22px, 4vh, 31px);
            height: clamp(22px, 4vh, 31px);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 2px solid #ffffff;
            border-radius: 50%;

            background: linear-gradient(
                180deg,
                #72ed78,
                #18b941
            );

            color: #ffffff;

            font-size: clamp(16px, 2.8vh, 22px);
            font-weight: 900;

            line-height: 1;

            box-shadow: 0 2px 5px rgba(0, 80, 30, 0.3);
        }

        /* =====================================
           9. SETTINGS BUTTON
        ===================================== */

        .settings-button {
            width: clamp(39px, 6vh, 51px);
            height: clamp(39px, 6vh, 51px);

            display: flex;
            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            border: 2px solid #ffffff;
            border-radius: 50%;

            background: linear-gradient(
                180deg,
                #ffffff,
                #dcefff
            );

            color: #278bd0;

            font-size: clamp(22px, 3.5vh, 30px);

            box-shadow:
                0 3px 8px rgba(0, 65, 130, 0.25);
        }

        /* =====================================
           10. PLAY NOW BUTTON
        ===================================== */

        .main-actions {
            position: absolute;

            left: 0;
            right: 0;

            /*
               Positioned above the bottom artwork
               and its love message.
            */

            bottom: clamp(12%, 15vh, 19%);

            display: flex;
            align-items: center;
            justify-content: center;

            padding-left: 5%;
            padding-right: 5%;
        }

        .play-button {
            width: min(82%, 350px);

            min-height: clamp(53px, 8vh, 74px);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            padding: 10px 20px;

            border: 3px solid #ffffff;
            border-radius: 22px;

            background: linear-gradient(
                180deg,
                #72ee7b 0%,
                #2bd052 55%,
                #13a83e 100%
            );

            color: #ffffff;

            font-size: clamp(19px, 3.5vh, 28px);
            font-weight: 900;

            letter-spacing: 1px;

            text-shadow: 0 2px 3px rgba(0, 90, 30, 0.35);

            box-shadow:
                0 6px 0 #087e32,
                0 9px 16px rgba(0, 65, 30, 0.3);
        }

        .play-icon {
            font-size: 0.85em;
        }

        /* =====================================
           11. SMALL PHONE SCREENS
        ===================================== */

        @media (max-width: 360px) {

            .top-bar {
                left: 2%;
                right: 2%;
            }

            .currency-container {
                gap: 5px;
            }

            .currency-counter {
                width: clamp(88px, 29vw, 105px);
                gap: 3px;
                padding: 3px 4px;
            }

            .currency-amount {
                font-size: 11px;
            }

            .currency-icon {
                width: 25px;
                height: 25px;
            }

            .currency-add-button {
                width: 22px;
                height: 22px;
            }

            .settings-button {
                width: 39px;
                height: 39px;
            }

            .play-button {
                width: 86%;
            }
        }

        /* =====================================
           12. SHORT PHONE SCREENS
        ===================================== */

        @media (max-height: 600px) {

            .currency-counter {
                height: 36px;
            }

            .settings-button {
                width: 38px;
                height: 38px;
            }

            .play-button {
                min-height: 47px;
                font-size: 18px;
            }

            .main-actions {
                bottom: 12%;
            }
        }

        /* =====================================
           13. WIDE PHONE SCREENS
        ===================================== */

        @media (min-width: 600px) {

            .currency-counter {
                width: 155px;
                height: 52px;
            }

            .settings-button {
                width: 54px;
                height: 54px;
            }

            .play-button {
                width: min(55%, 360px);
            }
        }

        /* =====================================
           14. LANDSCAPE SCREEN ADJUSTMENTS
        ===================================== */

        @media (orientation: landscape) {

            .top-bar {
                top: 3%;
            }

            .main-actions {
                bottom: 10%;
            }

            .play-button {
                width: min(40%, 300px);
                min-height: 46px;
            }

        }

        /* =====================================
           15. PREVENT UNWANTED SELECTION
        ===================================== */

        img {
            -webkit-user-drag: none;
        }

        button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 4px;
        }

    </style>

</head>

<body>

    <main id="app">

        <section id="home-screen">

            <!-- Full screen background artwork -->

            <img
                src="assets/home-background.webp"
                alt=""
                class="home-background"
                draggable="false"
            >

            <!-- Interface elements -->

            <div class="home-interface">

                <!-- TOP BAR -->

                <header class="top-bar">

                    <div class="currency-container">

                        <!-- COIN COUNTER -->

                        <div class="currency-counter" id="coin-counter">

                            <img
                                src="assets/coin.webp"
                                alt="Coin"
                                class="currency-icon"
                            >

                            <span
                                class="currency-amount"
                                id="coin-balance"
                            >0</span>

                            <button
                                type="button"
                                class="currency-add-button"
                                id="add-coins"
                                aria-label="Get more coins"
                            >
                                +
                            </button>

                        </div>

                        <!-- DIAMOND COUNTER -->

                        <div class="currency-counter" id="diamond-counter">

                            <img
                                src="assets/diamond.webp"
                                alt="Diamond"
                                class="currency-icon"
                            >

                            <span
                                class="currency-amount"
                                id="diamond-balance"
                            >0</span>

                            <button
                                type="button"
                                class="currency-add-button"
                                id="add-diamonds"
                                aria-label="Get more diamonds"
                            >
                                +
                            </button>

                        </div>

                    </div>

                    <!-- SETTINGS -->

                    <button
                        type="button"
                        class="settings-button"
                        id="settings-button"
                        aria-label="Settings"
                    >
                        <span aria-hidden="true">⚙</span>
                    </button>

                </header>

                <!-- PLAY BUTTON -->

                <section class="main-actions">

                    <button
                        type="button"
                        class="play-button"
                        id="play-now"
                    >

                        <span class="play-icon" aria-hidden="true">
                            ▶
                        </span>

                        <span>PLAY NOW</span>

                    </button>

                </section>

            </div>

        </section>

    </main>

</body>

</html>
