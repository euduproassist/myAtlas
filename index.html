
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#39a9ef">

    <title>TileyPop</title>

    <style>

        /* =====================================
           1. GLOBAL SETTINGS
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #39a9ef;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }


        /* =====================================
           2. FULL-SCREEN APPLICATION
        ===================================== */

        #app {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;
            height: 100dvh;

            overflow: hidden;
        }

        .home-screen {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;
            height: 100dvh;

            overflow: hidden;
            isolation: isolate;
        }


        /* =====================================
           3. FULL-SCREEN BACKGROUND IMAGE
        ===================================== */

        .home-background {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            z-index: -1;

            pointer-events: none;
            -webkit-user-drag: none;
        }


        /* =====================================
           4. HOME SCREEN INTERFACE
        ===================================== */

        .home-interface {
            position: relative;

            width: 100%;
            height: 100%;

            padding-top: max(12px, env(safe-area-inset-top));
            padding-right: max(14px, env(safe-area-inset-right));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            padding-left: max(14px, env(safe-area-inset-left));
        }


        /* =====================================
           5. TOP BAR
        ===================================== */

        .top-bar {
            position: absolute;

            top: max(12px, env(safe-area-inset-top));
            left: max(14px, env(safe-area-inset-left));
            right: max(14px, env(safe-area-inset-right));

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;

            z-index: 2;
        }


        /* Currency counters */

        .currency-container {
            display: flex;
            align-items: center;

            gap: clamp(7px, 2vw, 14px);

            min-width: 0;
        }

        .currency-counter {
            display: flex;
            align-items: center;
            justify-content: space-between;

            width: clamp(105px, 29vw, 145px);
            height: clamp(39px, 6vh, 51px);

            gap: 5px;
            padding: 4px 7px;

            border: 2px solid rgba(255,255,255,0.95);
            border-radius: 40px;

            background: rgba(35, 133, 210, 0.92);

            box-shadow:
                0 3px 8px rgba(0, 65, 130, 0.25),
                inset 0 2px 4px rgba(255,255,255,0.25);
        }


        /* Coin and diamond images */

        .currency-icon {
            width: clamp(27px, 5vh, 39px);
            height: clamp(27px, 5vh, 39px);

            flex-shrink: 0;

            object-fit: contain;
        }


        /* Currency balances */

        .currency-amount {
            flex: 1;
            min-width: 0;

            color: #ffffff;

            font-size: clamp(12px, 2.2vh, 18px);
            font-weight: 900;

            text-align: center;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

            text-shadow: 0 1px 3px rgba(0,0,0,0.35);
        }


        /* Green plus buttons */

        .currency-add-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: clamp(23px, 4vh, 31px);
            height: clamp(23px, 4vh, 31px);

            flex-shrink: 0;

            border: 2px solid #ffffff;
            border-radius: 50%;

            background: linear-gradient(
                180deg,
                #70ed76,
                #18b942
            );

            color: #ffffff;

            font-size: clamp(17px, 3vh, 23px);
            font-weight: 900;
            line-height: 1;

            box-shadow: 0 2px 5px rgba(0,80,30,0.3);
        }


        /* =====================================
           6. SETTINGS BUTTON
        ===================================== */

        .settings-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: clamp(40px, 6vh, 51px);
            height: clamp(40px, 6vh, 51px);

            flex-shrink: 0;

            border: 2px solid #ffffff;
            border-radius: 50%;

            background: linear-gradient(
                180deg,
                #ffffff,
                #d9efff
            );

            color: #2587d0;

            font-size: clamp(23px, 3.5vh, 30px);

            box-shadow: 0 3px 8px rgba(0,65,130,0.25);
        }


        /* =====================================
           7. PLAY NOW BUTTON
        ===================================== */

        .play-area {
            position: absolute;

            left: 0;
            right: 0;

            bottom: calc(15% + env(safe-area-inset-bottom));

            display: flex;
            justify-content: center;

            padding: 0 20px;

            z-index: 2;
        }

        .play-button {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            width: min(78%, 340px);
            min-height: clamp(54px, 8vh, 72px);

            padding: 10px 22px;

            border: 3px solid #ffffff;
            border-radius: 22px;

            background: linear-gradient(
                180deg,
                #65ed79 0%,
                #20c84e 55%,
                #12a83c 100%
            );

            color: #ffffff;

            font-size: clamp(19px, 3.5vh, 27px);
            font-weight: 900;
            letter-spacing: 1px;

            text-shadow: 0 2px 3px rgba(0,90,30,0.35);

            box-shadow:
                0 6px 0 #087f32,
                0 9px 16px rgba(0,65,30,0.3);
        }

        .play-icon {
            font-size: 0.85em;
        }


        /* =====================================
           8. SMALL PHONE SCREENS
        ===================================== */

        @media (max-width: 360px) {

            .top-bar {
                left: max(9px, env(safe-area-inset-left));
                right: max(9px, env(safe-area-inset-right));
            }

            .currency-container {
                gap: 5px;
            }

            .currency-counter {
                width: clamp(94px, 29vw, 110px);
                padding: 3px 5px;
                gap: 3px;
            }

            .currency-amount {
                font-size: 12px;
            }

            .play-button {
                width: 86%;
            }
        }


        /* =====================================
           9. SHORT PHONE SCREENS
        ===================================== */

        @media (max-height: 600px) {

            .top-bar {
                top: max(6px, env(safe-area-inset-top));
            }

            .currency-counter {
                height: 36px;
            }

            .settings-button {
                width: 37px;
                height: 37px;
                font-size: 21px;
            }

            .play-area {
                bottom: calc(12% + env(safe-area-inset-bottom));
            }

            .play-button {
                min-height: 46px;
                border-radius: 16px;
            }
        }


        /* =====================================
           10. EXTRA WIDE PHONE SCREENS
        ===================================== */

        @media (min-width: 600px) {

            .currency-counter {
                width: 150px;
            }

            .play-button {
                width: 340px;
            }
        }

    </style>

</head>


<body>

    <main id="app">

        <section class="home-screen">

            <!-- Full-screen TileyPop artwork -->

            <img
                src="assets/home-background.webp"
                alt=""
                class="home-background"
                draggable="false"
            >


            <!-- Home screen interface -->

            <div class="home-interface">


                <!-- TOP BAR -->

                <header class="top-bar">


                    <!-- COINS AND DIAMONDS -->

                    <div class="currency-container">


                        <!-- COIN COUNTER -->

                        <div class="currency-counter">

                            <img
                                src="assets/coin.webp"
                                alt="Coins"
                                class="currency-icon"
                            >

                            <span
                                class="currency-amount"
                                id="coin-balance"
                            >
                                0
                            </span>

                            <button
                                type="button"
                                class="currency-add-button"
                                id="add-coins"
                                aria-label="Get more coins"
                            >
                                +
                            </button>

                        </div>


                        <!-- DIAMOND COUNTER -->

                        <div class="currency-counter">

                            <img
                                src="assets/diamond.webp"
                                alt="Diamonds"
                                class="currency-icon"
                            >

                            <span
                                class="currency-amount"
                                id="diamond-balance"
                            >
                                0
                            </span>

                            <button
                                type="button"
                                class="currency-add-button"
                                id="add-diamonds"
                                aria-label="Get more diamonds"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- SETTINGS -->

                    <button
                        type="button"
                        class="settings-button"
                        id="settings-button"
                        aria-label="Settings"
                    >
                        ⚙
                    </button>

                </header>


                <!-- PLAY BUTTON -->

                <section class="play-area">

                    <button
                        type="button"
                        class="play-button"
                        id="play-now"
                    >

                        <span class="play-icon">▶</span>

                        <span>PLAY NOW</span>

                    </button>

                </section>


            </div>

        </section>

    </main>

</body>

</html>
