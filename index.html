
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#39a9f5">
    <meta name="description" content="TileyPop - Pick, Remember, Rebuild. Turn your photos into amazing puzzles!">
    <title>TileyPop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app">
        <!-- Home screen will be built here -->
        <section id="home-screen" class="screen">
            <div class="home-content">

                <!-- Currency counters -->
                <header class="top-bar">
                    <div class="currency-container">
                        <div class="currency" id="coin-counter">
                            <img src="assets/coin.webp" alt="Coins">
                            <span id="coin-balance">0</span>
                            <button class="add-currency" id="add-coins" aria-label="Get more coins">+</button>
                        </div>

                        <div class="currency" id="diamond-counter">
                            <img src="assets/diamond.webp" alt="Diamonds">
                            <span id="diamond-balance">0</span>
                            <button class="add-currency" id="add-diamonds" aria-label="Get more diamonds">+</button>
                        </div>
                    </div>

                    <button class="settings-button" id="settings-button" aria-label="Settings">
                        ⚙
                    </button>
                </header>

                <!-- Main home screen actions -->
                <section class="home-actions">
                    <button id="play-now" class="primary-button">Play Now</button>

                    <div class="navigation-buttons">
                        <button id="my-gallery" class="navigation-button">My Gallery</button>
                        <button id="my-progress" class="navigation-button">My Progress</button>
                        <button id="daily-challenge" class="navigation-button">Daily Challenge</button>
                    </div>
                </section>

            </div>
        </section>
    </main>

    <script src="game.js"></script>
</body>
</html>
