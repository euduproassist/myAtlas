<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TileyPop | Production Launcher</title>

    <style>
        /* ==========================================================================
           1. PRODUCTION ENVIRONMENT VARIABLES
           ========================================================================== */
        :root {
            --ui-black: #000000;
            --ui-charcoal: #0a0a0a;
            --safe-area-top: env(safe-area-inset-top, 0px);
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --safe-area-left: env(safe-area-inset-left, 0px);
            --safe-area-right: env(safe-area-inset-right, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: var(--ui-black);
            overflow: hidden !important;
        }

        /* ==========================================================================
           2. FLUID UI ENGINE
           ========================================================================== */
        .viewport-container {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh;
            display: grid;
            grid-template-areas: "main";
            overflow: hidden;
            position: relative;
        }

        .stage {
            grid-area: main;
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-rows: var(--safe-area-top) 1fr var(--safe-area-bottom);
            padding-left: var(--safe-area-left);
            padding-right: var(--safe-area-right);
            z-index: 10;
            box-sizing: border-box;
        }

        /* Adaptive Background Architecture */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            z-index: 0;
            background-color: var(--ui-charcoal);
        }
    </style>
</head>
<body>

    <div class="viewport-container" id="app-root">
        <!-- Splash -->
        <section class="stage is-active" id="screen-splash">
            <img src="https://euduproassist.github.io/myAtlas/assets/home-background.webp" class="bg-layer" alt="Splash Background">
        </section>
    </div>

</body>
</html>
